services:
  app:
    build:
      context: .
      args:
        BASE: apache
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${DATABASE_USER}:${DATABASE_PASS}@mysql:3306/${DATABASE_BASE}?charset=utf8mb4&serverVersion=10.11.0-MariaDB
      ADMINMAIL: ${ADMINMAIL}
      ADMINPASS: ${ADMINPASS}
      # Override with the exact reverse-proxy IP, CIDR, or hostname when one is
      # present. The loopback-only default prevents forwarded-header spoofing
      # when this compose file is used without a proxy container.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1,::1}"
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}
    volumes:
      - gppro_data:/opt/gppro/var/data
      - gppro_plugins:/opt/gppro/var/plugins
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8001:8001"

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASS}
      MARIADB_DATABASE: ${DATABASE_BASE}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASS}
    volumes:
      - gppro_db:/var/lib/mysql

volumes:
  gppro_data:
  gppro_plugins:
  gppro_db:
