services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $projectDirectory: '%kernel.project_dir%'
            $kernelEnvironment: '%kernel.environment%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude:
            - '../src/API/Model/'
            - '../src/DependencyInjection/'
            - '../src/Doctrine/Extensions/'
            - '../src/Entity/'
            - '../src/Event/'
            - '../src/Export/Package/'
            - '../src/Export/Base/'
            - '../src/Form/Model/'
            - '../src/Model/'
            - '../src/Repository/Loader/'
            - '../src/Repository/Paginator/'
            - '../src/Repository/Query/'
            - '../src/Repository/Result/'
            - '../src/WorkingTime/Calculator/'
            - '../src/Kernel.php'
            - '../src/Constants.php'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # ================================================================================
    # APPLICATION CORE
    # ================================================================================

    security.user.provider.chain:
        class: App\Security\GpproUserProvider

    App\Configuration\MailConfiguration:
        arguments: ['%env(MAILER_FROM)%']

    App\Service\QuotationPdfRendererInterface: '@App\Service\QuotationPdfRenderer'
    App\Service\ExpensePdfRendererInterface: '@App\Service\ExpensePdfRenderer'

    # Doctrine repositories extending EntityRepository need an explicit factory
    # when injected into controllers/services. The factory supplies the
    # EntityManager metadata that EntityRepository's inherited constructor
    # requires.
    App\Repository\QuotationRepository:
        factory: ['@doctrine.orm.default_entity_manager', getRepository]
        arguments: [App\Entity\Quotation]

    App\Repository\QuotationCatalogItemRepository:
        factory: ['@doctrine.orm.default_entity_manager', getRepository]
        arguments: [App\Entity\QuotationCatalogItem]

    App\Repository\QuotationEmailRepository:
        factory: ['@doctrine.orm.default_entity_manager', getRepository]
        arguments: [App\Entity\QuotationEmail]

    App\Configuration\LocaleService:
        arguments: ['%gppro.languages%']

    App\Configuration\SystemConfiguration:
        arguments:
            $settings: '%gppro.config%'

    # HTTP client used by mPDF to fetch remote resources (e.g. logos referenced
    # from custom Twig invoice templates). Decorated with NoPrivateNetworkHttpClient
    # so requests to private/loopback/link-local targets are blocked at the
    # network layer — defense in depth for SSRF.
    # @see https://github.com/kimai/kimai/security/advisories/GHSA-pj8j-p4g4-4vw8
    Symfony\Component\HttpClient\NoPrivateNetworkHttpClient:
        arguments:
            - '@http_client'

    App\Pdf\SafeRemoteContentClient:
        arguments:
            - '@Symfony\Component\HttpClient\NoPrivateNetworkHttpClient'

    App\Pdf\MPdfConverter:
        arguments:
            $cacheDirectory: '%kernel.cache_dir%'
            $httpClient: '@App\Pdf\SafeRemoteContentClient'

    # HTTP client used by MindicadorClient (App\FxRate) to fetch daily USD/UF
    # rates from mindicador.cl. Decorated with RetryableHttpClient so a
    # transient transport error or 5xx blip on the once-a-day sync job gets
    # one automatic retry (2 attempts total, 1s initial delay, factor 2 —
    # GenericRetryStrategy defaults). Deliberately does NOT retry 404, which
    # is how mindicador.cl signals "no data for this date" (weekend/holiday),
    # not an outage — retrying it would only waste time on the normal case.
    Symfony\Component\HttpClient\RetryableHttpClient:
        arguments:
            - '@http_client'
            - null
            - 1

    App\FxRate\MindicadorClient:
        arguments:
            $httpClient: '@Symfony\Component\HttpClient\RetryableHttpClient'

    App\Utils\FileHelper:
        arguments:
            $dataDir: '%gppro.data_dir%'

    App\API\Serializer\ValidationFailedExceptionErrorHandler:
        arguments: ['@translator.default', '@fos_rest.serializer.flatten_exception_handler']

    App\Command\ExportCreateCommand:
        arguments:
            $mailer: '@App\Mail\GpproMailer'

    # ================================================================================
    # TIMESHEET RECORD CALCULATOR
    # ================================================================================

    App\Timesheet\RoundingService:
        arguments:
            # this is currently required, as local.yaml allows to configure several rules,
            # while the database system only allows one rounding rule
            $rules: '%gppro.timesheet.rounding%'

    App\Timesheet\RateService:
        arguments: ['%gppro.timesheet.rates%']

    App\Timesheet\RateCalculator\RateCalculatorMode:
        factory: ['@App\Timesheet\RateCalculator\RateCalculatorFactory', getRateCalculatorMode]

    # ================================================================================
    # SECURITY & VOTER
    # ================================================================================

    App\Security\RoleService:
        arguments:
            $roles: '%gppro.permission_roles%'

    App\Security\RolePermissionManager:
        arguments:
            $permissions: '%gppro.permissions%'
            $permissionNames: '%gppro.permission_names%'

    # ================================================================================
    # SAML Services
    # ================================================================================
    App\Saml\SamlProvider:
        arguments:
            $userProvider: '@security.user.provider.concrete.gppro_internal'
            $configuration: '@App\Configuration\SamlConfigurationInterface'

    # ================================================================================
    # REPOSITORIES
    # ================================================================================

