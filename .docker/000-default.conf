<VirtualHost *:8001>
    ServerAdmin webmaster@localhost
    DocumentRoot /opt/gppro/public

    PassEnv MAILER_FROM
    PassEnv APP_ENV
    PassEnv APP_SECRET
    PassEnv DATABASE_URL
    PassEnv MAILER_URL
    PassEnv TRUSTED_PROXIES
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    SetEnvIf CF-Visitor "\"scheme\":\"https\"" HTTPS=on

    <Directory "/opt/gppro/public">
        Require all granted
        DirectoryIndex index.php
        AllowOverride All
    </Directory>

</VirtualHost>

ServerName localhost
