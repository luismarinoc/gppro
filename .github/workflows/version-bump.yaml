name: Bump version

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions: {}

jobs:
    bump:
        name: Bump patch version
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, 'chore(release): bump version')"
        permissions:
            contents: write

        steps:

            -   name: Checkout
                uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
                with:
                    persist-credentials: true

            -   name: Bump patch version in Constants.php
                id: bump
                run: |
                    CURRENT=$(grep -oP "(?<=VERSION = ')[^']+" src/Constants.php)
                    IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
                    NEW_PATCH=$((PATCH + 1))
                    NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
                    NEW_VERSION_ID=$((MAJOR * 10000 + MINOR * 100 + NEW_PATCH))

                    sed -i "s/VERSION = '$CURRENT';/VERSION = '$NEW_VERSION';/" src/Constants.php
                    sed -i "s/VERSION_ID = [0-9]*;/VERSION_ID = $NEW_VERSION_ID;/" src/Constants.php

                    echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

            -   name: Commit and push
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add src/Constants.php
                    git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
                    git push
